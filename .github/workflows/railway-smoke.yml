name: Railway image smoke

on:
  push:
    paths:
      - "Dockerfile.railway"
      - "requirements-api.txt"
      - "src/**"
      - "scripts/gates/railway_smoke.py"
      - "scripts/gates/_embed_stub.py"
      - ".github/workflows/railway-smoke.yml"
  pull_request:
    paths:
      - "Dockerfile.railway"
      - "requirements-api.txt"
      - "src/**"
      - "scripts/gates/railway_smoke.py"
      - "scripts/gates/_embed_stub.py"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/gates/railway_smoke.py
